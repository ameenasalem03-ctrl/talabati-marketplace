<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=login.html">
    <title>إعداد المدير</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top right, #e4efdc 0, transparent 35%), #f6f7f0;
            color: #1f2a24;
            font-family: Cairo, Segoe UI, sans-serif;
            padding: 24px;
        }
        main {
            width: min(100%, 420px);
            background: #fff;
            padding: 32px;
            border: 1px solid #e1e9de;
            border-radius: 22px;
            box-shadow: 0 22px 50px #30493618;
            text-align: center;
        }
        h1 { color: #54733b; margin: 0 0 10px; font-size: 1.5rem; }
        p { color: #6b7280; line-height: 1.7; margin: 0 0 20px; }
        a { color: #556b2f; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>حساب المدير يُنشأ من إعدادات النشر</h1>
        <p>لم تعد هذه الصفحة تُستخدم لإنشاء المدير. يتم إنشاء حساب المدير تلقائياً عند تشغيل الخادم عبر متغيرات البيئة.</p>
        <a href="login.html">العودة إلى تسجيل الدخول</a>
    </main>
</body>
</html>
