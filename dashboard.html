<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة البائع — طلباتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body {
            font-family: Tahoma, Cairo, sans-serif;
            padding: 20px;
            background: #f6f7f0;
            color: #1f2a24;
        }

        .card-area {
            max-width: 1100px;
            margin: 0 auto;
        }

        .thumbnail {
            width: 96px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <!-- كود إعادة التوجيه في أول سكربت -->
    <script>
        (function () {
            if (!localStorage.getItem('saas_token')) {
                window.location.href = 'products.html?login=1';
            }
        })();
    </script>

    <div id="site-navbar"></div>

    <div id="app" class="card-area">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h4 class="mb-0">لوحة البائع</h4>
            <div class="d-flex align-items-center gap-2">
                <span v-if="user" class="small text-muted">مرحباً، {{ user.name || user.email }}</span>
                <a href="products.html" class="btn btn-link btn-sm text-decoration-none">عرض المتجر</a>
            </div>
        </div>

        <div v-if="!user" class="alert alert-warning">سجّل دخولك لتتمكن من إدارة منتجات متجرك.</div>

        <section v-if="user" class="mb-4">
            <div class="d-flex gap-2 mb-2">
                <input v-model="newProduct.name" class="form-control form-control-sm" placeholder="اسم المنتج">
                <input v-model="newProduct.price" class="form-control form-control-sm" placeholder="السعر">
                <input v-model="newProduct.imageUrl" class="form-control form-control-sm" placeholder="رابط الصورة (أو ارفع)">
                <input type="file" ref="fileInput" @change="onFileChange" class="form-control form-control-sm" style="max-width:220px;">
                <button class="btn btn-success btn-sm" @click="createProduct">إنشاء</button>
            </div>
            <textarea v-model="newProduct.description" class="form-control form-control-sm mb-2" rows="2" placeholder="وصف المنتج"></textarea>
        </section>

        <section>
            <h5>منتجات المتجر</h5>
            <div v-if="loading" class="text-muted">جارٍ التحميل...</div>
            <div v-else>
                <div v-if="products.length === 0" class="text-muted">لا توجد منتجات بعد.</div>
                <div class="list-group">
                    <div v-for="p in products" :key="p.id" class="list-group-item d-flex align-items-center">
                        <img :src="p.imageUrl || ''" class="thumbnail me-3" v-if="p.imageUrl">
                        <div class="flex-grow-1">
                            <strong>{{ p.name }}</strong>
                            <div class="small text-muted">{{ p.description }}</div>
                            <div class="small">السعر: {{ Number(p.price || 0).toFixed(3) }} د.ب</div>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-primary" @click="editProduct(p)">تعديل</button>
                            <button class="btn btn-sm btn-danger" @click="deleteProduct(p.id)">حذف</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Edit modal (simple) -->
        <div v-if="editing" class="modal-backdrop" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;">
            <div class="card p-3" style="width:520px;">
                <h6>تعديل المنتج</h6>
                <input v-model="editing.name" class="form-control form-control-sm mb-2" placeholder="اسم">
                <input v-model="editing.price" class="form-control form-control-sm mb-2" placeholder="السعر">
                <input v-model="editing.imageUrl" class="form-control form-control-sm mb-2" placeholder="رابط الصورة">
                <input type="file" ref="editFile" @change="onEditFileChange" class="form-control form-control-sm mb-2">
                <textarea v-model="editing.description" class="form-control form-control-sm mb-2" rows="3"></textarea>
                <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-secondary btn-sm" @click="editing = null">إلغاء</button>
                    <button class="btn btn-primary btn-sm" @click="saveEdit">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script>
        const API_BASE = window.API_BASE || `${location.protocol}//${location.hostname}${location.port ? ':' + location.port : ''}`;
        const TOKEN_KEY = 'saas_token';

        const { createApp, ref } = Vue;
        createApp({
            data() {
                return {
                    user: null,
                    products: [],
                    loading: false,
                    newProduct: { name: '', description: '', price: '', imageUrl: '' },
                    fileToUpload: null,
                    editing: null
                };
            },
            mounted() {
                this.restoreAuthAndLoad();
            },
            methods: {
                getAuthHeaders() {
                    const token = localStorage.getItem(TOKEN_KEY);
                    return token ? { Authorization: `Bearer ${token}`, Accept: 'application/json' } : { Accept: 'application/json' };
                },
                async apiFetch(path, opts = {}) {
                    const url = path.startsWith('http') ? path : `${API_BASE}${path.startsWith('/') ? '' : '/'}${path}`;
                    const headers = Object.assign({}, opts.headers || {}, this.getAuthHeaders());
                    let body = opts.body;
                    if (body && typeof body === 'object' && !(body instanceof FormData)) {
                        headers['Content-Type'] = 'application/json';
                        body = JSON.stringify(body);
                    }
                    const res = await fetch(url, Object.assign({}, opts, { headers, body }));
                    if (!res.ok) {
                        const txt = await res.text();
                        let parsed;
                        try { parsed = JSON.parse(txt); } catch { parsed = txt; }
                        throw parsed;
                    }
                    const ct = (res.headers.get('content-type') || '').toLowerCase();
                    if (ct.includes('application/json')) return res.json();
                    const txt = await res.text(); try { return JSON.parse(txt); } catch { return txt; }
                },
                async restoreAuthAndLoad() {
                    const token = localStorage.getItem(TOKEN_KEY);
                    if (!token) return;
                    try {
                        const resp = await this.apiFetch('/api/auth/me', { method: 'GET' });
                        if (resp && resp.user) {
                            this.user = resp.user;
                        } else if (resp && resp.id) {
                            this.user = resp;
                        }
                        await this.loadProducts();
                    } catch (err) {
                        console.warn('restoreAuth failed', err);
                        localStorage.removeItem(TOKEN_KEY);
                    }
                },
                async loadProducts() {
                    if (!this.user) return;
                    this.loading = true;
                    try {
                        const rows = await this.apiFetch('/api/admin/products', { method: 'GET' });
                        this.products = rows;
                    } catch (err) {
                        console.error('loadProducts admin error', err);
                    } finally { this.loading = false; }
                },
                async onFileChange(e) {
                    const f = e.target.files && e.target.files[0];
                    if (!f) return;
                    const fd = new FormData();
                    fd.append('image', f);
                    try {
                        const resp = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: fd, headers: this.getAuthHeaders() });
                        if (!resp.ok) {
                            const txt = await resp.text(); throw txt;
                        }
                        const json = await resp.json();
                        this.newProduct.imageUrl = json.imageUrl;
                    } catch (err) {
                        console.error('upload error', err); alert('فشل رفع الصورة');
                    }
                },
                async onEditFileChange(e) {
                    const f = e.target.files && e.target.files[0];
                    if (!f) return;
                    const fd = new FormData(); fd.append('image', f);
                    try {
                        const resp = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: fd, headers: this.getAuthHeaders() });
                        if (!resp.ok) { const txt = await resp.text(); throw txt; }
                        const json = await resp.json();
                        if (this.editing) this.editing.imageUrl = json.imageUrl;
                    } catch (err) {
                        console.error('upload error', err); alert('فشل رفع الصورة');
                    }
                },
                async createProduct() {
                    try {
                        const payload = {
                            name: this.newProduct.name,
                            description: this.newProduct.description,
                            price: Number(this.newProduct.price) || 0,
                            imageUrl: this.newProduct.imageUrl || null
                        };
                        await this.apiFetch('/api/admin/products', { method: 'POST', body: payload });
                        this.newProduct = { name: '', description: '', price: '', imageUrl: '' };
                        this.$refs && this.$refs.fileInput && (this.$refs.fileInput.value = '');
                        await this.loadProducts();
                    } catch (err) {
                        console.error('createProduct error', err); alert((err && err.error) || 'فشل إنشاء المنتج');
                    }
                },
                editProduct(p) {
                    this.editing = Object.assign({}, p);
                },
                async saveEdit() {
                    if (!this.editing) return;
                    try {
                        const payload = { name: this.editing.name, description: this.editing.description, price: Number(this.editing.price) || 0, imageUrl: this.editing.imageUrl || null };
                        await this.apiFetch(`/api/admin/products/${this.editing.id}`, { method: 'PUT', body: payload });
                        this.editing = null;
                        await this.loadProducts();
                    } catch (err) {
                        console.error('saveEdit error', err); alert((err && err.error) || 'فشل حفظ التعديلات');
                    }
                },
                async deleteProduct(id) {
                    if (!confirm('هل تريد حذف هذا المنتج؟')) return;
                    try {
                        await this.apiFetch(`/api/admin/products/${id}`, { method: 'DELETE' });
                        await this.loadProducts();
                    } catch (err) {
                        console.error('deleteProduct error', err); alert((err && err.error) || 'فشل الحذف');
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
