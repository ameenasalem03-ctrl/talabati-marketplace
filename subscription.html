<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الاشتراكات - Talabati Smart Stores</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #0f172a;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
        }
        .fixed-info {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            color: #475569;
            font-weight: 600;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f1f5f9;
            border-radius: 8px;
            display: none;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #0f172a;
        }
        .result-item {
            font-size: 14px;
            color: #475569;
            margin-bottom: 8px;
        }
        .result-item span {
            font-weight: bold;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تسجيل اشتراك Ko-fi (3 أشهر)</h2>
        
        <div class="form-group">
            <label for="subscriberName">اسم المشترك:</label>
            <input type="text" id="subscriberName" placeholder="أدخل اسم المشترك...">
        </div>

        <div class="form-group">
            <label>تفاصيل الباقة:</label>
            <div class="fixed-info">مدة الاشتراك: 3 أشهر | القيمة: 15 دينار بحريني</div>
        </div>

        <button id="calcBtn">تفعيل الحساب الآلي</button>

        <div id="resultBox" class="result-box">
            <h3>تفاصيل اشتراك المشترك:</h3>
            <div class="result-item">اسم المشترك: <span id="displayName"></span></div>
            <div class="result-item">تاريخ البداية: <span id="startDate"></span></div>
            <div class="result-item">تاريخ نهاية الاشتراك (بعد 3 أشهر): <span id="endDate"></span></div>
            <div class="result-item">قيمة الاشتراك المدفوعة: <span>15 د.ب</span></div>
        </div>
    </div>

    <script>
        const calcBtn = document.getElementById('calcBtn');
        const subscriberNameInput = document.getElementById('subscriberName');
        const resultBox = document.getElementById('resultBox');
        
        const displayNameSpan = document.getElementById('displayName');
        const startDateSpan = document.getElementById('startDate');
        const endDateSpan = document.getElementById('endDate');

        calcBtn.addEventListener('click', function() {
            const name = subscriberNameInput.value.trim();
            if (name === "") {
                alert("الرجاء إدخال اسم المشترك أولاً.");
                return;
            }

            // تاريخ اليوم الحالي تلقائياً كبداية
            const today = new Date();
            
            // إضافة 3 أشهر تلقائياً لتاريخ النهاية
            const endDate = new Date(today);
            endDate.setMonth(endDate.getMonth() + 3);

            // تنسيق التواريخ باللغة العربية
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            
            displayNameSpan.textContent = name;
            startDateSpan.textContent = today.toLocaleDateString('ar-BH', options);
            endDateSpan.textContent = endDate.toLocaleDateString('ar-BH', options);

            // إظهار صندوق النتائج
            resultBox.style.display = 'block';
        });
    </script>

</body>
</html>
