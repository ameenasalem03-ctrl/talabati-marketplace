<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة مبيعات وتوزيع الأسر المنتجة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --danger-color: #E74C3C;
            --warning-color: #f39c12;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .btn-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn-success { background-color: var(--success-color); }
        .btn-primary { background-color: var(--primary-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-warning { background-color: var(--warning-color); grid-column: span 2; }
        .btn:hover { opacity: 0.9; }

        .stats-box {
            background-color: #f8fafc;
            border-right: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .list-title {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .sales-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            background: #fff;
        }

        .sale-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .sale-item:last-child { border-bottom: none; }

        .action-links {
            text-align: center;
            margin-top: 15px;
        }
        .action-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .action-links a:hover { text-decoration: underline; }

        @media print {
            .form-group, .btn-container, h2, .action-links {
                display: none !important;
            }
            body {
                background-color: #fff;
                padding: 0;
            }
            .dashboard-container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>🛒 نظام إدارة مبيعات وتوزيع الأسر المنتجة</h2>
        
        <div class="form-group">
            <label>اسم الزبون:</label>
            <input type="text" id="customerName" placeholder="مثال: أم أحمد">
        </div>

        <div class="form-group">
            <label>رقم هاتف الزبون:</label>
            <input type="text" id="customerPhone" placeholder="مثال: 39xxxxxx">
        </div>

        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="productName" placeholder="اكتبي اسم المنتج هنا">
        </div>

        <div class="form-group">
            <label>السعر (د.ب):</label>
            <input type="number" id="productPrice" step="0.001" placeholder="0.000">
        </div>

        <div class="form-group">
            <label>الكمية المبيعة:</label>
            <input type="number" id="productQty" value="1">
        </div>

        <div class="form-group">
            <label>حالة التوصيل والتوزيع الحالية:</label>
            <select id="deliveryStatus">
                <option value="⏳ قيد التجهيز بالمنزل">⏳ قيد التجهيز بالمنزل</option>
                <option value="🚗 مع المندوب للتوصيل">🚗 مع المندوب للتوصيل</option>
                <option value="✅ تم التوصيل والاستلام">✅ تم التوصيل والاستلام</option>
            </select>
        </div>

        <!-- الأزرار المنسقة والموزعة في مكانها المناسب مع الـ APIs -->
        <div class="btn-container">
            <button class="btn btn-success" onclick="registerSale()"><i class="fa-solid fa-plus"></i> تسجيل البيعة</button>
            <button class="btn btn-primary" onclick="printInvoice()"><i class="fa-solid fa-print"></i> طباعة الفاتورة</button>
            <button class="btn btn-warning" onclick="renewStoreSubscription()"><i class="fa-solid fa-rotate"></i> تجديد اشتراك المتجر</button>
            <button class="btn btn-danger" onclick="clearData()" style="grid-column: span 2;"><i class="fa-solid fa-trash"></i> تصفير وبدء يوم جديد</button>
        </div>

        <div class="stats-box">
            <span>👥 إجمالي عدد الزبائن اليوم:</span>
            <span id="totalCustomers">0 زبائن</span>
        </div>

        <div class="list-title">قائمة المبيعات والتوزيع التفصيلية:</div>
        <div class="sales-list" id="salesList">
            <!-- المبيعات المضافة ستظهر هنا تلقائياً -->
        </div>

        <div class="stats-box" style="border-right-color: #f1c40f; margin-top: 15px;">
            <span>💰 إجمالي المبيعات الكلية:</span>
            <span id="totalSales">0.000 د.ب</span>
        </div>

        <div class="action-links" style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="admin.html"><i class="fa-solid fa-gauge"></i> لوحة الإدارة والمنتجات</a>
            <a href="products.html"><i class="fa-solid fa-store"></i> تصفح المنتجات</a>
        </div>
    </div>

    <script>
        let sales = JSON.parse(localStorage.getItem('talabati_sales')) || [];

        function updateUI() {
            const list = document.getElementById('salesList');
            list.innerHTML = '';
            let totalMoney = 0;
            let customersCount = sales.length;

            sales.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                totalMoney += itemTotal;

                let row = document.createElement('div');
                row.className = 'sale-item';
                row.innerHTML = `
                    <div onclick="toggleItemStatus(${index})" style="cursor:pointer;">
                        <strong>${item.customer}</strong> - ${item.product} (${item.qty} قطع) <br>
                        <small style="color:var(--text-muted);">${item.status}</small>
                    </div>
                    <div style="text-align: left;">
                        <span style="color:var(--primary-color); font-weight:bold;">${itemTotal.toFixed(3)} د.ب</span>
                        <br><button onclick="deleteItem(${index})" style="background:none; border:none; color:red; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-xmark"></i> حذف</button>
                    </div>
                `;
                list.appendChild(row);
            });

            document.getElementById('totalCustomers').innerText = `${customersCount} زبائن`;
            document.getElementById('totalSales').innerText = `${totalMoney.toFixed(3)} د.ب`;
            localStorage.setItem('talabati_sales', JSON.stringify(sales));
        }

        function registerSale() {
            const customer = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const product = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value) || 0;
            const qty = parseInt(document.getElementById('productQty').value) || 1;
            const status = document.getElementById('deliveryStatus').value;

            if (!customer || !product) {
                alert('الرجاء إدخال اسم الزبون واسم المنتج على الأقل!');
                return;
            }

            sales.push({ customer, phone, product, price, qty, status });
            updateUI();

            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productQty').value = '1';
        }

        function toggleItemStatus(index) {
            if(sales[index].status === "⏳ قيد التجهيز بالمنزل") {
                sales[index].status = "🚗 مع المندوب للتوصيل";
            } else if(sales[index].status === "🚗 مع المندوب للتوصيل") {
                sales[index].status = "✅ تم التوصيل والاستلام";
            } else {
                sales[index].status = "⏳ قيد التجهيز بالمنزل";
            }
            updateUI();
        }

        function deleteItem(index) {
            sales.splice(index, 1);
            updateUI();
        }

        function printInvoice() {
            if (sales.length === 0) {
                alert('لا توجد مبيعات لطباعة فاتورتها!');
                return;
            }
            window.print();
        }

        function clearData() {
            if (confirm('هل أنتِ متأكدة من تصفير البيانات وبدء يوم جديد؟')) {
                sales = [];
                updateUI();
            }
        }

        // دالة الاتصال بمسار تجديد الاشتراك في السيرفر (API)
        async function renewStoreSubscription() {
            const storeId = prompt("أدخل معرف المتجر (Store ID) للتجديد:");
            if (!storeId) return;
            const plan = prompt("اختر الباقة المطلوبة (bronze / silver / gold):", "bronze");
            if (!plan || !['bronze', 'silver', 'gold'].includes(plan.trim().toLowerCase())) {
                alert("يرجى اختيار باقة صحيحة: bronze أو silver أو gold");
                return;
            }
            const months = prompt("مدة الاشتراك بالأشهر (1 لشهر واحد، أو 12 لسنة كاملة):", "1");
            if (!months || ![1, 12].includes(Number(months))) {
                alert("يرجى إدخال 1 (شهر) أو 12 (سنة)");
                return;
            }
            try {
                const response = await fetch(`/api/admin/stores/${encodeURIComponent(storeId.trim())}/renew`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscriptionPlan: plan.trim().toLowerCase(), months: Number(months) })
                });
                const result = await response.json();
                alert(response.ok ? 'تم تجديد اشتراك المتجر بنجاح.' : (result.error || 'فشل التجديد'));
            } catch (err) {
                alert('حدث خطأ في الاتصال بالخادم.');
            }
        }

        updateUI();
    </script>
</body>
</html>
